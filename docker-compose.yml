version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: civicpulse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: civicpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicpulse -d civicpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: civicpulse_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
