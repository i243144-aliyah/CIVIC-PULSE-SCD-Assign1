[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"app/core/config.py" = ["S104"]
"app/providers/triage/llm.py" = ["S311"]
"app/providers/triage/ollama.py" = ["S311"]
"app/routes/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]
