# alembic.ini
# ──────────────────────────────────────────────────────────────────────────────
# Alembic configuration for CivicPulse.
#
# CRITICAL: Table creation is EXCLUSIVELY managed via Alembic migrations.
# Never call Base.metadata.create_all() in application code.
# ──────────────────────────────────────────────────────────────────────────────

[alembic]
# Location of the migration scripts directory
script_location = alembic

# Jinja2 template for migration file names: timestamp + slug
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for generated timestamps
timezone = UTC

# Truncate revision identifiers in file names to 12 chars
truncate_slug_length = 40

# Max line length in generated migration files
output_encoding = utf-8

# ── Database URL ──────────────────────────────────────────────────────────────
# Alembic uses the SYNC psycopg2 DSN (set via DATABASE_SYNC_URL env var).
# This is overridden in env.py using python-dotenv so the value never needs
# to be hard-coded here.
sqlalchemy.url = postgresql+psycopg2://civicpulse:secret@localhost:5432/civicpulse

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
