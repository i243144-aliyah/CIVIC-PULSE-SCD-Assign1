apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secret
type: Opaque
stringData:
  POSTGRES_USER: civicpulse
  POSTGRES_PASSWORD: replace-with-a-long-random-password
  POSTGRES_DB: civicpulse
  DATABASE_URL: postgresql+asyncpg://civicpulse:replace-with-a-long-random-password@database:5432/civicpulse
  DATABASE_SYNC_URL: postgresql+psycopg2://civicpulse:replace-with-a-long-random-password@database:5432/civicpulse