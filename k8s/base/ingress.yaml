apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civicpulse
  labels:
    app.kubernetes.io/part-of: civicpulse
spec:
  ingressClassName: nginx
  rules:
    - host: civicpulse.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80