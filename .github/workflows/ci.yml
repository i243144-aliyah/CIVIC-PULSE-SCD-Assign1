name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev
    tags:
      - "v*"

permissions: {}

jobs:
  lint-and-type:
    name: Lint and type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install backend quality tools
        run: python -m pip install --upgrade pip ruff==0.16.9 mypy==2.3.1 -r backend/requirements.txt
      - name: Ruff
        run: ruff check .
        working-directory: backend
      - name: Python formatting
        run: ruff format --check .
        working-directory: backend
      - name: Mypy
        run: mypy app/
        working-directory: backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend lint
        run: npm --prefix frontend run lint
      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRIAGE_PROVIDER: simulated
      REDIS_URL: redis://localhost:6379/1
      DATABASE_URL: postgresql+asyncpg://civicpulse:civicpulse@localhost:5432/civicpulse
      DATABASE_SYNC_URL: postgresql+psycopg2://civicpulse:civicpulse@localhost:5432/civicpulse
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: civicpulse
          POSTGRES_DB: civicpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicpulse -d civicpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
        working-directory: backend
      - name: Run backend tests with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65
        working-directory: backend

  test-frontend:
    name: Frontend component tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run Vitest suite
        run: npm test -- --passWithNoTests=false
        working-directory: frontend

  build:
    name: Build container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build frontend and backend images
        working-directory: frontend
        run: |
          docker build --pull --tag civicpulse-frontend:${{ github.sha }} .
          cd ..
          docker build -t civicpulse-backend:test ./backend
          docker tag civicpulse-backend:test civicpulse-backend:${{ github.sha }}

  scan:
    name: Scan container images
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build backend image for scanning
        run: docker build --pull --tag civicpulse-backend:${{ github.sha }} ./backend
      - name: Build frontend image for scanning
        run: docker build --pull --tag civicpulse-frontend:${{ github.sha }} ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: civicpulse-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: civicpulse-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: "1"
          ignore-unfixed: true

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install kustomize
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize
      - name: Install kubeconform
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Build and validate development manifests
        run: kustomize build k8s/overlays/dev | kubeconform -strict -summary -ignore-missing-schemas -skip VerticalPodAutoscaler
      - name: Build and validate production manifests
        run: kustomize build k8s/overlays/prod | kubeconform -strict -summary -ignore-missing-schemas -skip VerticalPodAutoscaler

  integration:
    name: Compose integration smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: civicpulse
      POSTGRES_DB: civicpulse
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Compose integration smoke test
        run: bash -x scripts/ci_integration_test.sh
        env:
          COMPOSE_PROGRESS: plain
          TRIAGE_PROVIDER: simulated
