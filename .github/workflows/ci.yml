name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev

# Empty permissions are the repository-wide least-privilege baseline.
permissions: {}

jobs:
  lint-and-type:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend quality tools
        run: python -m pip install --upgrade pip ruff mypy -r backend/requirements.txt
      - name: Ruff
        run: ruff check app tests
        working-directory: backend
      - name: Mypy
        run: mypy app
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: ESLint
        run: npm run lint
        working-directory: frontend
      - name: TypeScript
        run: npm exec tsc -- --noEmit
        working-directory: frontend

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      REDIS_URL: redis://localhost:6379/1
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
        working-directory: backend
      - name: Run backend tests with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65
        working-directory: backend

  test-frontend:
    name: Frontend component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run Vitest suite
        run: npm test -- --passWithNoTests=false
        working-directory: frontend

  build:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag civicpulse-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build --tag civicpulse-frontend:${{ github.sha }} ./frontend

  scan:
    name: Scan container images
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image for scanning
        run: docker build --tag civicpulse-backend:${{ github.sha }} ./backend
      - name: Build frontend image for scanning
        run: docker build --tag civicpulse-frontend:${{ github.sha }} ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: civicpulse-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize and kubeconform
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize
          curl --fail --silent --show-error --location \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Build and validate production manifests
        run: kustomize build k8s/overlays/prod | kubeconform -strict -summary
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: civicpulse-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true