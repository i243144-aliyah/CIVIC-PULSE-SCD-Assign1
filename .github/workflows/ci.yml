name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - dev

permissions: read-all

jobs:
  lint-and-type:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend quality tools
        run: python -m pip install --upgrade pip ruff mypy -r backend/requirements.txt
      - name: Ruff
        run: ruff check .
        working-directory: backend
      - name: Mypy
        run: mypy app/
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend lint
        run: npm --prefix frontend run lint
      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRIAGE_PROVIDER: simulated
      REDIS_URL: redis://localhost:6379/1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: civicpulse
          POSTGRES_DB: civicpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicpulse -d civicpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
        working-directory: backend
      - name: Set database connection
        run: echo "DATABASE_SYNC_URL=postgresql+psycopg2://civicpulse:civicpulse@localhost:5432/civicpulse" >> "$GITHUB_ENV"
      - name: Run backend tests with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65
        working-directory: backend

  test-frontend:
    name: Frontend component tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run Vitest suite
        run: npm test -- --passWithNoTests=false
        working-directory: frontend

  build:
    name: Build container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --pull --file backend/Dockerfile --tag civicpulse-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build --pull --file frontend/Dockerfile --tag civicpulse-frontend:${{ github.sha }} ./frontend

  scan:
    name: Scan container images
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image for scanning
        run: docker build --tag civicpulse-backend:${{ github.sha }} ./backend
      - name: Build frontend image for scanning
        run: docker build --tag civicpulse-frontend:${{ github.sha }} ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2
        with:
          image-ref: civicpulse-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2
        with:
          image-ref: civicpulse-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: "1"
          ignore-unfixed: true

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize and kubeconform
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize
          curl --fail --silent --show-error --location \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Build and validate development manifests
        run: |
          kustomize build k8s/overlays/dev \
            | kubeconform -strict -summary -skip VerticalPodAutoscaler
      - name: Build and validate production manifests
        run: |
          kustomize build k8s/overlays/prod \
            | kubeconform -strict -summary -skip VerticalPodAutoscaler

  integration:
    name: Compose integration smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4
      - name: Run Compose integration smoke test
        run: bash scripts/ci_integration_test.sh