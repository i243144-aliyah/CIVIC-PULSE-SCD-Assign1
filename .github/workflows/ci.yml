name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev

# Empty permissions are the repository-wide least-privilege baseline.
permissions: {}

jobs:
  lint-and-type:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend quality tools
        run: python -m pip install --upgrade pip ruff mypy -r backend/requirements.txt
      - name: Ruff
        run: ruff check app tests
        working-directory: backend
      - name: Mypy
        run: mypy app
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: ESLint
        run: npm run lint
        working-directory: frontend
      - name: TypeScript
        run: npm exec tsc -- --noEmit
        working-directory: frontend

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      REDIS_URL: redis://localhost:6379/1
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
        working-directory: backend
      - name: Run backend tests with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65
        working-directory: backend