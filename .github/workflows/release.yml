name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  test:
    name: Validate release source
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      REDIS_URL: redis://localhost:6379/1
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
        working-directory: backend
      - name: Run backend tests
        run: pytest --cov=app --cov-fail-under=65
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm test -- --passWithNoTests=false
        working-directory: frontend

  release:
    name: Publish semver release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend release image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/civicpulse-backend:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAMESPACE }}/civicpulse-backend:latest
      - name: Build and push frontend release image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/civicpulse-frontend:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAMESPACE }}/civicpulse-frontend:latest
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${RELEASE_TAG}" --generate-notes --verify-tag