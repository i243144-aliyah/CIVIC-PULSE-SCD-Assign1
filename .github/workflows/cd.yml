name: Continuous Deployment

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  test:
    name: Test merged result
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRIAGE_PROVIDER: simulated
      REDIS_URL: redis://localhost:6379/1
      DATABASE_URL: postgresql+asyncpg://civicpulse:civicpulse@localhost:5432/civicpulse
      DATABASE_SYNC_URL: postgresql+psycopg2://civicpulse:civicpulse@localhost:5432/civicpulse
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: civicpulse
          POSTGRES_DB: civicpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicpulse -d civicpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
        working-directory: backend
      - name: Run backend suite
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65
        working-directory: backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend suite
        run: npm test -- --passWithNoTests=false
        working-directory: frontend

  build-and-push:
    name: Build and publish images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend-digest: ${{ steps.backend.outputs.digest }}
      frontend-digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Normalize GHCR image namespace
        id: namespace
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.namespace.outputs.value }}/civicpulse-backend:${{ github.sha }}
            ${{ steps.namespace.outputs.value }}/civicpulse-backend:latest
      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.namespace.outputs.value }}/civicpulse-frontend:${{ github.sha }}
            ${{ steps.namespace.outputs.value }}/civicpulse-frontend:latest
      - name: Emit backend SBOM
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          image: ${{ steps.namespace.outputs.value }}/civicpulse-backend:${{ github.sha }}
          artifact-name: civicpulse-backend-${{ github.sha }}.spdx.json
          output-file: civicpulse-backend-${{ github.sha }}.spdx.json
      - name: Emit frontend SBOM
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          image: ${{ steps.namespace.outputs.value }}/civicpulse-frontend:${{ github.sha }}
          artifact-name: civicpulse-frontend-${{ github.sha }}.spdx.json
          output-file: civicpulse-frontend-${{ github.sha }}.spdx.json
      - name: Print image digests
        run: |
          echo "backend digest: ${{ steps.backend.outputs.digest }}"
          echo "frontend digest: ${{ steps.frontend.outputs.digest }}"

  deploy-kind:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.31.0
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          cluster_name: civicpulse
      - name: Install nginx ingress controller
        run: |
          kubectl apply --filename https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=Ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=180s
      - name: Install kustomize
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize
      - name: Create registry pull secret
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull \
            --namespace civicpulse \
            --docker-server=ghcr.io \
            --docker-username="${GITHUB_ACTOR}" \
            --docker-password="$REGISTRY_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default --namespace civicpulse \
            --type merge --patch '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'
      - name: Apply immutable production manifests
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image \
            backend=ghcr.io/${GITHUB_REPOSITORY,,}/civicpulse-backend:${{ github.sha }} \
            frontend=ghcr.io/${GITHUB_REPOSITORY,,}/civicpulse-frontend:${{ github.sha }}
          kubectl apply -k .
          kubectl -n civicpulse rollout status statefulset/database --timeout=300s
          kubectl -n civicpulse rollout status deployment/cache --timeout=300s
          kubectl -n civicpulse rollout status deployment/backend --timeout=900s
          kubectl -n civicpulse rollout status deployment/frontend --timeout=300s
          kubectl -n civicpulse exec deployment/backend -- alembic upgrade head
      - name: Smoke test through Ingress and print autoscaling state
        run: |
          kubectl port-forward --namespace ingress-nginx --address 127.0.0.1 \
            service/ingress-nginx-controller 8080:80 > "$RUNNER_TEMP/ingress-port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --retry 30 --retry-connrefused \
            --retry-delay 2 --retry-max-time 90 \
            --header 'Host: civicpulse.example.com' \
            http://127.0.0.1:8080/api/meta/providers > "$RUNNER_TEMP/ingress-smoke.json"; then
            cat "$RUNNER_TEMP/ingress-port-forward.log"
            kubectl get ingress --namespace civicpulse
            exit 1
          fi
          complaint_status=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/complaint.json" --write-out '%{http_code}' \
            --header 'Host: civicpulse.example.com' \
            --header 'Content-Type: application/json' \
            --data '{"text":"A burst water pipe is flooding the main road","location":"Civic Square"}' \
            http://127.0.0.1:8080/api/complaints)
          [[ "$complaint_status" == "201" ]]
          complaint_id=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' \
            "$RUNNER_TEMP/complaint.json")
          get_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Host: civicpulse.example.com' \
            "http://127.0.0.1:8080/api/complaints/${complaint_id}")
          [[ "$get_status" == "200" ]]
          kubectl get hpa --namespace civicpulse
