name: Continuous Deployment

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  test:
    name: Test merged result
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      REDIS_URL: redis://localhost:6379/1
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
        working-directory: backend
      - name: Run backend suite
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend suite
        run: npm test -- --passWithNoTests=false
        working-directory: frontend

  build-push:
    name: Build and publish images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      backend-digest: ${{ steps.backend.outputs.digest }}
      frontend-digest: ${{ steps.frontend.outputs.digest }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/civicpulse-backend:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/civicpulse-backend:latest
      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/civicpulse-frontend:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}/civicpulse-frontend:latest
      - name: Emit backend SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/civicpulse-backend:${{ github.sha }}
          artifact-name: civicpulse-backend-${{ github.sha }}.spdx.json
          output-file: civicpulse-backend-${{ github.sha }}.spdx.json
      - name: Emit frontend SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ${{ env.IMAGE_NAMESPACE }}/civicpulse-frontend:${{ github.sha }}
          artifact-name: civicpulse-frontend-${{ github.sha }}.spdx.json
          output-file: civicpulse-frontend-${{ github.sha }}.spdx.json

  deploy-k8s:
    name: Deploy to Kubernetes
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: civicpulse
      - name: Install nginx ingress controller
        run: |
          kubectl apply --filename https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=Ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=180s
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Install kustomize
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz \
            | tar -xz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize
      - name: Create registry pull secret
        run: |
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-pull \
            --namespace civicpulse \
            --docker-server=ghcr.io \
            --docker-username="${GITHUB_ACTOR}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default --namespace civicpulse \
            --type merge --patch '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'
      - name: Apply immutable production manifests
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image \
            backend=${IMAGE_NAMESPACE}/civicpulse-backend:${{ github.sha }} \
            frontend=${IMAGE_NAMESPACE}/civicpulse-frontend:${{ github.sha }}
          kubectl apply -k .
          kubectl -n civicpulse rollout status deployment/backend --timeout=180s
          kubectl -n civicpulse rollout status deployment/frontend --timeout=180s
      - name: Smoke test through Ingress and print autoscaling state
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --header 'Host: civicpulse.example.com' http://127.0.0.1/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              kubectl get ingress --namespace civicpulse
              exit 1
            fi
            sleep 2
          done
          kubectl get hpa --namespace civicpulse